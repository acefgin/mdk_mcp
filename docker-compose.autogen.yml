version: '3.8'

# Docker Compose configuration for AutoGen + MCP Multi-Agent System
# This orchestrates MCP servers and AutoGen agents for qPCR assay design
#
# Permission handling: Containers use entrypoint scripts to automatically
# fix permissions on shared volumes and drop privileges to non-root users.
# No manual UID/GID configuration needed!

services:
  # ========================================
  # MCP Servers (Bioinformatics Tools)
  # ========================================

  # Phase 1: Database MCP Server
  database-server:
    build: ./mcp_servers/database_server
    container_name: ndiag-database-server
    stdin_open: true  # Required for MCP stdio protocol
    tty: false
    networks:
      - ndiag-network
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_cache
    volumes:
      - database_cache:/tmp/mcp_cache
      - ./results:/results  # Shared results directory (entrypoint fixes permissions)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "database_mcp_server"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 2: Processing MCP Server
  processing-server:
    build: ./mcp_servers/processing_server
    container_name: ndiag-processing-server
    stdin_open: true
    tty: false
    networks:
      - ndiag-network
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_cache
      - RESULTS_DIR=/results
    volumes:
      - processing_cache:/tmp/mcp_cache
      - ./results:/results  # Shared results (entrypoint fixes permissions)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "processing_mcp_server"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 3: Alignment MCP Server
  alignment-server:
    build: ./mcp_servers/alignment_server
    container_name: ndiag-alignment-server
    stdin_open: true
    tty: false
    networks:
      - ndiag-network
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_cache
      - RESULTS_DIR=/results
    volumes:
      - alignment_cache:/tmp/mcp_cache
      - ./results:/results  # Shared results (entrypoint fixes permissions)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "alignment_mcp_server"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 4: Design MCP Server
  design-server:
    build: ./mcp_servers/design_server
    container_name: ndiag-design-server
    stdin_open: true
    tty: false
    networks:
      - ndiag-network
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_cache
      - RESULTS_DIR=/results
    volumes:
      - design_cache:/tmp/mcp_cache
      - ./results:/results  # Shared results (entrypoint fixes permissions)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "design_mcp_server"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 5: Validation MCP Server
  validation-server:
    build: ./mcp_servers/validation_server
    container_name: ndiag-validation-server
    stdin_open: true
    tty: false
    networks:
      - ndiag-network
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - NCBI_EMAIL=${NCBI_EMAIL:-user@example.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_validation
      - BLAST_CACHE_DIR=/tmp/mcp_validation/blast_cache
      - RESULTS_DIR=/results
      - BLASTDB=/blastdb
      - BLASTDB_CUSTOM=/blastdb_custom
    volumes:
      - validation_cache:/tmp/mcp_validation/blast_cache
      - ./results:/results/validation  # Shared results (entrypoint fixes permissions)
      # Optional: Mount local BLAST databases (read-only)
      # - /path/to/your/blastdb:/blastdb:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "blastn", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Code Execution Sandbox
  # ========================================

  code-execution-sandbox:
    build: ./code-execution
    container_name: code-execution-sandbox
    stdin_open: true  # Required for MCP stdio protocol
    tty: false
    networks:
      - ndiag-network
    environment:
      - EXECUTION_TIMEOUT=30000
      - MAX_OUTPUT_SIZE=1048576
      - WORKSPACE_PATH=/workspace
      - NODE_ENV=production
    volumes:
      - workspace_data:/workspace/data
      - workspace_cache:/workspace/cache
      - workspace_results:/workspace/results
      - ./workspace/servers:/workspace/servers:ro  # Read-only access to tool modules
      - ./workspace/lib:/workspace/lib:ro  # MCP client library
      - ./workspace/helpers.js:/workspace/helpers.js:ro  # Helper functions
      - ./workspace/helpers.js.map:/workspace/helpers.js.map:ro  # Source map
      - ./mcp_servers:/app/mcp_servers:ro  # Read-only access to shared utilities
      - ./results:/results  # Shared results directory
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for MCP tool communication
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ========================================
  # AutoGen Application
  # ========================================

  qpcr-assistant:
    build: ./autogen_app
    container_name: qpcr-assistant
    depends_on:
      - database-server
      - processing-server
      - alignment-server
      - design-server
      - validation-server
      - code-execution-sandbox
    networks:
      - ndiag-network
    env_file:
      - ./autogen_app/.env
    environment:
      - MCP_DATABASE_SERVER=ndiag-database-server
      - MCP_PROCESSING_SERVER=ndiag-processing-server
      - MCP_ALIGNMENT_SERVER=ndiag-alignment-server
      - MCP_DESIGN_SERVER=ndiag-design-server
      - MCP_VALIDATION_SERVER=ndiag-validation-server
      - AUTOGEN_MAX_ROUNDS=50
      - RESULTS_DIR=/results
    volumes:
      - ./autogen_app:/app
      - ./results:/results  # Shared results (readable by all)
      - /var/run/docker.sock:/var/run/docker.sock  # Access to Docker for MCP communication
    ports:
      - "8501:8501"  # Streamlit UI (if enabled)
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # Optional: Streamlit UI for qPCR Assistant
  # qpcr-ui:
  #   build: ./autogen_app
  #   container_name: qpcr-ui
  #   depends_on:
  #     - qpcr-assistant
  #   networks:
  #     - ndiag-network
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #   ports:
  #     - "8501:8501"
  #   command: streamlit run streamlit_app.py

networks:
  ndiag-network:
    driver: bridge
    name: ndiag-network

volumes:
  database_cache:
    driver: local
  processing_cache:
    driver: local
  alignment_cache:
    driver: local
  design_cache:
    driver: local
  validation_cache:
    driver: local
  workspace_data:
    driver: local
  workspace_cache:
    driver: local
  workspace_results:
    driver: local
  results:
    driver: local
