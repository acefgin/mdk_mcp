version: '3.8'

services:
  alignment-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ndiag-alignment-server
    image: ndiag-alignment-server:latest
    stdin_open: true  # Keep stdin open for MCP stdio protocol
    tty: false
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=/tmp/mcp_alignment
      - MAX_SEQUENCES=${MAX_SEQUENCES:-10000}
      - DEFAULT_MAFFT_STRATEGY=${DEFAULT_MAFFT_STRATEGY:-auto}
      - DEFAULT_MAX_ITERATIONS=${DEFAULT_MAX_ITERATIONS:-1000}
      - DEFAULT_GAP_THRESHOLD=${DEFAULT_GAP_THRESHOLD:-0.5}
      - DEFAULT_PHYLO_METHOD=${DEFAULT_PHYLO_METHOD:-nj}
      - DEFAULT_BOOTSTRAP=${DEFAULT_BOOTSTRAP:-100}
      - DEFAULT_DISTANCE_MODEL=${DEFAULT_DISTANCE_MODEL:-kimura}
    volumes:
      - alignment_cache:/tmp/mcp_alignment
    restart: unless-stopped
    networks:
      - mcp-network

volumes:
  alignment_cache:
    driver: local

networks:
  mcp-network:
    driver: bridge
